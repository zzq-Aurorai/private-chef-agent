[project]
name = "hello-uv"
version = "0.1.0"
description = "多模态营养分析 Agent：LangGraph + DeepSeek + FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alibabacloud-oss-v2>=1.4.1",
    "fastapi>=0.162.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.7",
    "langchain-deepseek>=1.1.1",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-cli[inmem]>=0.4.38",
    "notebook>=7.6.3",
    "openai>=3.36.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
hello-uv = "hello_uv:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
